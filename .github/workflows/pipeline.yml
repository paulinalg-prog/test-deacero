
name: DEACERO - Data Pipeline

on:
  # Ejecución manual desde GitHub
  workflow_dispatch:

  # Ejecución programada diariamente a las 12:00 UTC
  schedule:
    - cron: "0 12 * * *"

  # Recepción de eventos externos
  repository_dispatch:
    types: [airbyte_sync_completed]

jobs:
  run-pipeline:
    name: Execute Data Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb pandas pytest python-dotenv

      - name: Run data pipeline
        run: |
          python scripts/run_pipeline.py --trigger manual
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          deacero_logistica:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "$GITHUB_WORKSPACE/deacero.duckdb"
                schema: main
                threads: 4
          EOF

      - name: Validate dbt connection
        run: dbt debug --project-dir dbt